<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intrusion 뷰어</title>
<!--
  IIHS 구조(intrusion) 뷰어 — 로컬 MVP v1.2
  - 시험 3종을 탭으로 구분: Small overlap 운전석 / Small overlap 조수석 / Moderate overlap 2.0
  - 단일 HTML 파일 (HTML + CSS + vanilla JS, 외부 라이브러리 없음, 서버 불필요)
  - 단위는 전부 mm
  - run 폴더 구조: <run 폴더>/<서브폴더>/results.csv  (예: R001_baseline/output/results.csv)
  - 시험 종류는 CSV 의 측정위치(location) 이름으로 자동 구분해 해당 탭에 넣는다
  - Apps Script 전환 시: "데이터 로드" 섹션(FileReader)만 google.script.run 으로 교체
-->
<style>
  :root {
    --bg: #ffffff; --surface: #f5f4f0; --border: #dddcd6; --text: #1f1f1d; --text-2: #5f5e5a; --muted: #898781;
    --good-t: #3b6d11; --warn-t: #854f0b; --bad-t: #a32d2d; --danger: #a32d2d; --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19; --surface: #262624; --border: #3a3a37; --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
      --good-t: #97c459; --warn-t: #fac775; --bad-t: #f09595; --danger: #f09595; --accent: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 12px; }
  h1 small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  h2 { font-size: 14px; font-weight: 500; color: var(--text-2); margin: 20px 0 8px; }
  button { font: inherit; }
  .btn { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text);
         font-size: 13px; padding: 5px 12px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .drop { border: 1.5px dashed var(--border); border-radius: 8px; padding: 14px; text-align: center;
          font-size: 14px; color: var(--text-2); }
  .drop.over { border-color: var(--accent); background: var(--surface); }
  .drop .actions { display: flex; justify-content: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .drop input { display: none; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .tabs { display: flex; gap: 4px; margin: 16px 0 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab { background: none; border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0;
         color: var(--text-2); font-size: 14px; padding: 8px 14px; cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: var(--bg); border-color: var(--border); color: var(--text); font-weight: 500; }
  .tab .cnt { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 10px;
              background: var(--surface); color: var(--text-2); font-size: 11px; font-weight: 500; text-align: center; }
  .tab[aria-selected="true"] .cnt { background: var(--accent); color: #fff; }
  .src { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }

  .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; font-size: 13px; color: var(--text-2); }
  .toolbar .sp { flex: 1; }
  .toolbar .btn { padding: 3px 10px; font-size: 12px; }
  .runs { list-style: none; margin: 0 0 12px; padding: 0; font-size: 13px; display: grid;
          grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0 16px; }
  .runs li { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--border); }
  .runs label { display: flex; align-items: center; gap: 6px; cursor: pointer; flex: 1; min-width: 0; }
  .runs .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .runs .off .nm { color: var(--muted); }
  .runs .x { background: none; border: none; color: var(--muted); font-size: 12px; padding: 2px 4px; cursor: pointer; }
  .runs .x:hover { color: var(--danger); }
  .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; vertical-align: -1px; }
  .swatch.none { visibility: hidden; }
  .empty { font-size: 13px; color: var(--muted); margin: 10px 0; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .card { background: var(--surface); border-radius: 8px; padding: 8px 12px; }
  .card .k { font-size: 12px; color: var(--text-2); }
  .card .v { font-size: 16px; font-weight: 500; }
  .card .w { font-size: 12px; color: var(--danger); }
  .chart-box { max-width: 820px; margin: 0 auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .legend span { display: flex; align-items: center; gap: 4px; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; background: var(--bg); }
  th { font-weight: 500; color: var(--text-2); vertical-align: bottom; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; z-index: 1;
                                   border-right: 1px solid var(--border); }
  td.grp, td.th { color: var(--muted); }
  td.grp { text-align: left; }
  tr.split td { border-top: 2px dashed var(--muted); }
  tr.rating td { background: var(--surface); font-weight: 500; }
  tr.rating.first td { border-top: 2px solid var(--border); }
  th.run { min-width: 96px; max-width: 140px; white-space: normal; }
  th.run .rid { color: var(--text); }
  th.run .rnm { font-size: 11px; font-weight: 400; color: var(--muted); overflow-wrap: anywhere; }
  th.run label { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 400; cursor: pointer;
                 margin-bottom: 4px; }
  .charted { background-image: linear-gradient(rgba(57,135,229,.10), rgba(57,135,229,.10)); }
  /* 표 값 셀 바탕색: Good 그린, Acceptable 옐로우, Marginal 레드, Poor 진한 레드 */
  :root { --cell-g: #cdeec5; --cell-a: #fbe9a6; --cell-m: #f6c3bd; --cell-p: #c62f2f; }
  @media (prefers-color-scheme: dark) {
    :root { --cell-g: #2e5320; --cell-a: #66521a; --cell-m: #7a3330; --cell-p: #b02323; }
  }
  td.r0 { background: var(--cell-g); }
  td.r1 { background: var(--cell-a); }
  td.r2 { background: var(--cell-m); }
  td.r3 { background: var(--cell-p); color: #fff; font-weight: 600; }
  td.r0, td.r1, td.r2, td.r3 { border-left: 1px solid var(--bg); }
  .cell-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-2); margin: 0 0 6px; }
  .cell-legend span { display: flex; align-items: center; gap: 4px; }
  .cell-legend i { width: 14px; height: 12px; border-radius: 2px; display: inline-block; }

  #toasts { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex;
            flex-direction: column; gap: 6px; width: min(480px, calc(100% - 32px)); z-index: 10; }
  .toast { background: var(--text); color: var(--bg); border-radius: 6px; padding: 8px 12px; font-size: 13px;
           box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .toast.error { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>IIHS 구조 intrusion 뷰어 <small>v1.2</small></h1>

  <div class="drop" id="drop">
    run 폴더(또는 여러 run 폴더가 든 상위 폴더)나 CSV 파일을 여기에 끌어다 놓으세요
    <div class="actions">
      <button type="button" class="btn primary" id="pickFolder">폴더 선택</button>
      <button type="button" class="btn" id="pickFile">CSV 파일 선택</button>
    </div>
    <div class="hint">폴더를 고르면 하위 폴더의 <code>results.csv</code>를 모두 불러옵니다. run 이름은 run 폴더 이름에서,
      시험 종류는 CSV 의 측정위치 이름에서 자동으로 구분해 해당 탭에 넣습니다.</div>
    <input type="file" id="folder" webkitdirectory multiple>
    <input type="file" id="file" accept=".csv,text/csv" multiple>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="시험 종류"></nav>
  <p class="src" id="src"></p>

  <div class="toolbar" id="toolbar"></div>
  <ul class="runs" id="runs"></ul>

  <div id="cards" class="cards"></div>
  <div class="chart-box">
    <div id="chart"></div>
    <div class="legend" id="legend"></div>
  </div>

  <h2>측정값 (mm) — 열 머리의 "그래프"를 체크하면 위 차트에 그려집니다 (최대 3개)</h2>
  <div class="cell-legend">
    <span><i style="background:var(--cell-g)"></i>Good</span><span><i style="background:var(--cell-a)"></i>Acceptable</span>
    <span><i style="background:var(--cell-m)"></i>Marginal</span><span><i style="background:var(--cell-p)"></i>Poor</span>
  </div>
  <div class="table-wrap" id="table"></div>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
// @core-start — DOM 접근 없는 순수 로직 (tests/rating.test.js 가 이 구간만 읽어 테스트)

// ===== 1. 시험별 프로토콜 설정 (단위 mm, 기준값은 IIHS 원문 cm × 10) =====
// t: [Good 상한, Acceptable 상한, Marginal 상한], 초과 시 Poor. 경계값은 더 좋은 등급 (v <= 상한)
// csv: CSV 의 location 표기, calc: 값 계산 방법 (아래 CALC). 측정점이 여러 개면 평균한다
const LOWER_UPPER = [{ key: "lower", label: "Lower" }, { key: "upper", label: "Upper" }];

const PROTOCOLS = {
  so_driver: {
    id: "so_driver", tab: "Small overlap · 운전석",
    source: "IIHS Small Overlap Rating Protocol Version VII (April 2024)",
    note: "Lower / Upper 서브레이팅, 종합은 나쁜 쪽",
    groups: LOWER_UPPER, yMax: 450, yStep: 50,
    locations: [
      { key: "lower_hinge_pillar", label: "Lower hinge pillar", name: "Lower hinge pillar",     group: "lower", t: [150, 225, 300], csv: "Lower_Hinge_Pillar",    calc: "resultant" },
      { key: "footrest",           label: "Footrest",           name: "Footrest",               group: "lower", t: [150, 225, 300], csv: "Footrest",              calc: "resultant" },
      { key: "left_toepan",        label: "Left toepan",        name: "Left toepan",            group: "lower", t: [150, 225, 300], csv: "Left_Toepan",           calc: "resultant" },
      { key: "brake_pedal",        label: "Brake pedal",        name: "Brake pedal",            group: "lower", t: [150, 225, 300], csv: "Brake_Pedal",           calc: "resultant" },
      { key: "parking_brake",      label: "Parking brake",      name: "Parking brake pedal",    group: "lower", t: [150, 225, 300], csv: "Parking_Brake_Pedal",   calc: "resultant" },
      { key: "rocker_lat",         label: "Rocker (lat)",       name: "Rocker panel (lat)",     group: "lower", t: [50, 100, 150],  csv: "Rocker_Panel",          calc: "dy" },
      { key: "steering_long",      label: "Steering col.",      name: "Steering column (long)", group: "upper", t: [50, 100, 150],  csv: "Steering_Column",       calc: "dx" },
      { key: "upper_hinge_pillar", label: "Upper hinge pillar", name: "Upper hinge pillar",     group: "upper", t: [75, 125, 175],  csv: "Upper_Hinge_Pillar",    calc: "resultant" },
      { key: "upper_dash",         label: "Upper dash",         name: "Upper dash",             group: "upper", t: [75, 125, 175],  csv: "Upper_Dash",            calc: "resultant" },
      { key: "left_ip",            label: "Left IP",            name: "Left instrument panel",  group: "upper", t: [75, 125, 175],  csv: "Left_Instrument_Panel", calc: "resultant" },
    ],
  },
  so_passenger: {
    id: "so_passenger", tab: "Small overlap · 조수석",
    source: "IIHS Small Overlap Rating Protocol Version VII (April 2024), Appendix Figure A-4",
    note: "운전석과 같은 규칙: Lower / Upper 서브레이팅, 종합은 나쁜 쪽",
    groups: LOWER_UPPER, yMax: 450, yStep: 50,
    locations: [
      { key: "lower_hinge_pillar", label: "Lower hinge pillar", name: "Lower hinge pillar", group: "lower", t: [150, 225, 300], csv: "Lower_Hinge_Pillar", calc: "resultant" },
      { key: "footrest",           label: "Footrest",           name: "Footrest",           group: "lower", t: [150, 225, 300], csv: "Footrest",           calc: "resultant" },
      { key: "right_toepan",       label: "Right toepan",       name: "Right toepan",       group: "lower", t: [150, 225, 300], csv: "Right_Toepan",       calc: "resultant" },
      { key: "center_toepan",      label: "Center toepan",      name: "Center toepan",      group: "lower", t: [150, 225, 300], csv: "Center_Toepan",      calc: "resultant" },
      { key: "rocker_lat",         label: "Rocker (lat)",       name: "Rocker panel (lat)", group: "lower", t: [50, 100, 150],  csv: "Rocker_Panel",       calc: "dy" },
      { key: "center_dash",        label: "Center dash",        name: "Center dash",        group: "upper", t: [75, 125, 175],  csv: "Center_Dash",        calc: "resultant" },
      { key: "upper_hinge_pillar", label: "Upper hinge pillar", name: "Upper hinge pillar", group: "upper", t: [75, 125, 175],  csv: "Upper_Hinge_Pillar", calc: "resultant" },
      { key: "upper_dash",         label: "Upper dash",         name: "Upper dash",         group: "upper", t: [75, 125, 175],  csv: "Upper_Dash",         calc: "resultant" },
      { key: "right_lower_dash",   label: "Right lower dash",   name: "Right lower dash",   group: "upper", t: [75, 125, 175],  csv: "Right_Lower_Dash",   calc: "resultant" },
    ],
  },
  mo2: {
    id: "mo2", tab: "Moderate overlap 2.0",
    source: "IIHS Moderate Overlap 2.0 Rating Guidelines Version III (February 2026), Figure 7",
    note: "Lower / Upper 구분 없이 구조 단일 판정. Toepan·Footrest·Brake pedal 은 X-Y-Z 합성 (X 가 전방이면 Y-Z 합성), Instrument panel 은 후방 X 만",
    groups: [{ key: "structure", label: "Structure" }], yMax: 400, yStep: 50,
    locations: [
      { key: "footrest",      label: "Footrest",      name: "Footrest",               group: "structure", t: [150, 225, 300], csv: "Footrest",               calc: "xyz_or_yz" },
      { key: "left_toepan",   label: "Left toepan",   name: "Left toepan",            group: "structure", t: [150, 225, 300], csv: "Left_Toepan",            calc: "xyz_or_yz" },
      { key: "center_toepan", label: "Center toepan", name: "Center toepan",          group: "structure", t: [150, 225, 300], csv: "Center_Toepan",          calc: "xyz_or_yz" },
      { key: "right_toepan",  label: "Right toepan",  name: "Right toepan",           group: "structure", t: [150, 225, 300], csv: "Right_Toepan",           calc: "xyz_or_yz" },
      { key: "brake_pedal",   label: "Brake pedal",   name: "Brake pedal",            group: "structure", t: [150, 225, 300], csv: "Brake_Pedal",            calc: "xyz_or_yz" },
      { key: "left_ip",       label: "Left IP",       name: "Left instrument panel",  group: "structure", t: [50, 100, 150],  csv: "Left_Instrument_Panel",  calc: "dx" },
      { key: "right_ip",      label: "Right IP",      name: "Right instrument panel", group: "structure", t: [50, 100, 150],  csv: "Right_Instrument_Panel", calc: "dx" },
      { key: "door_opening",  label: "Door opening",  name: "Door opening",           group: "structure", t: [50, 100, 150],  csv: "Door_Opening",           calc: "resultant" },
    ],
  },
};
const PROTOCOL = PROTOCOLS.so_driver;   // 기본 시험 (운전석)

// CSV 한 행(숫자로 바꾼 컬럼) → 판정에 쓰는 값. dx_mm 은 + 가 후방(탑승자 쪽)
const CALC = {
  resultant: r => r.resultant_mm,                                                  // X-Y-Z 합성
  dx: r => r.dx_mm,                                                                // 전후 (X) 성분
  dy: r => r.dy_mm,                                                                // 좌우 (Y) 성분
  xyz_or_yz: r => (r.dx_mm < 0 ? Math.hypot(r.dy_mm, r.dz_mm) : r.resultant_mm),   // X 가 전방이면 Y-Z 합성
};
const CALC_COLUMNS = {
  resultant: ["resultant_mm"], dx: ["dx_mm"], dy: ["dy_mm"], xyz_or_yz: ["dx_mm", "dy_mm", "dz_mm", "resultant_mm"],
};

const RESULT_FILE = "results.csv";

// "R001_baseline.csv" / "R001_baseline" → "baseline", "R002_A-pillar_reinforced" → "A-pillar reinforced"
function nameFromFile(fileName) {
  return fileName.replace(/\.csv$/i, "").replace(/^R\d+_/i, "").replace(/_/g, " ");
}

// results.csv 경로에서 run 폴더 이름: <run 폴더>/<서브폴더>/results.csv
// "runs/R001_baseline/output/results.csv" → "R001_baseline", "output/results.csv" 처럼 얕으면 바로 위 폴더
function runFolderOf(path) {
  const dirs = path.split(/[\\/]/).filter(Boolean).slice(0, -1);
  if (dirs.length >= 2) return dirs[dirs.length - 2];
  return dirs.length ? dirs[0] : null;
}

// 폴더/파일 목록 → 읽을 대상. 폴더 안에서는 results.csv 만, 폴더 밖에 놓인 CSV는 파일명으로
function pickCsvTargets(paths) {
  const targets = [], skipped = [];
  paths.forEach(path => {
    const parts = path.split(/[\\/]/).filter(Boolean);
    const base = parts[parts.length - 1];
    if (parts.length > 1 && base.toLowerCase() === RESULT_FILE) {
      targets.push({ path, name: nameFromFile(runFolderOf(path)) });
    } else if (parts.length === 1 && /\.csv$/i.test(base)) {
      targets.push({ path, name: nameFromFile(base) });
    } else {
      skipped.push(path);
    }
  });
  return { targets, skipped };
}

function splitCsv(text) {
  const lines = text.replace(/^﻿/, "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  return { header: (lines[0] || "").split(",").map(h => h.trim()), rows: lines.slice(1).map(l => l.split(",").map(c => c.trim())) };
}

// CSV 표기 → location 설정
const csvIndex = protocol => Object.fromEntries(protocol.locations.map(l => [l.csv, l]));

// CSV 에 나오는 측정위치 이름 (중복 제거)
function csvLocationNames(text) {
  const { header, rows } = splitCsv(text);
  const ci = header.indexOf("location");
  return ci < 0 ? [] : [...new Set(rows.map(r => r[ci]))];
}

// 측정위치 이름이 가장 잘 맞는 시험: 점수 = 아는 이름 수 − 모르는 이름 수. 동점이면 fallback(현재 탭)
function detectProtocol(names, fallbackId) {
  const score = id => { const idx = csvIndex(PROTOCOLS[id]); return names.reduce((s, n) => s + (idx[n] ? 1 : -1), 0); };
  let best = fallbackId, bestScore = score(fallbackId);
  Object.keys(PROTOCOLS).forEach(id => {
    const s = score(id);
    if (s > bestScore) { best = id; bestScore = s; }
  });
  return best;
}

function parseCsv(text, fileName, runName, protocol = PROTOCOL) {
  const { header, rows } = splitCsv(text);
  if (!rows.length) throw new Error(`${fileName}: 데이터 행이 없습니다.`);
  const col = name => header.indexOf(name);
  ["run_id", "location"].forEach(c => {
    if (col(c) < 0) throw new Error(`${fileName}: '${c}' 컬럼이 없습니다.`);
  });

  const ids = [...new Set(rows.map(r => r[col("run_id")]))];
  if (ids.length !== 1 || !ids[0]) throw new Error(`${fileName}: run_id 가 하나여야 합니다 (발견: ${ids.join(", ") || "없음"}).`);

  const idx = csvIndex(protocol);
  const points = {}, unknown = new Set();
  rows.forEach(r => {
    const locName = r[col("location")];
    const loc = idx[locName];
    if (!loc) { unknown.add(locName); return; }
    const rec = {};
    CALC_COLUMNS[loc.calc].forEach(c => {
      const ci = col(c);
      if (ci < 0) throw new Error(`${fileName}: '${c}' 컬럼이 없습니다.`);
      const v = Number(r[ci]);
      if (r[ci] === undefined || r[ci] === "" || !Number.isFinite(v)) throw new Error(`${fileName}: ${locName} 의 ${c} 값이 숫자가 아닙니다.`);
      rec[c] = v;
    });
    (points[loc.key] = points[loc.key] || []).push(CALC[loc.calc](rec));
  });

  const values = {};
  Object.keys(points).forEach(k => {
    values[k] = points[k].reduce((a, b) => a + b, 0) / points[k].length;
  });

  const warnings = [];
  if (unknown.size) warnings.push(`알 수 없는 측정위치 무시: ${[...unknown].join(", ")}`);
  const missing = protocol.locations.filter(l => !(l.key in values)).map(l => l.name);
  if (missing.length) warnings.push(`누락된 측정위치: ${missing.join(", ")}`);

  return { runId: ids[0], name: runName || nameFromFile(fileName), fileName, test: protocol.id, values, warnings };
}

// ===== 2. 판정 로직 (세 시험 공통) =====
const RATINGS = ["Good", "Acceptable", "Marginal", "Poor"];

function bandOf(value, t) {
  if (value <= t[0]) return 0;
  if (value <= t[1]) return 1;
  if (value <= t[2]) return 2;
  return 3;
}

// 서브레이팅: 측정값이 가장 많이 속한 구간 (동률이면 더 나쁜 구간),
// 단 최악 측정값보다 한 단계 넘게 좋을 수 없음
function subRating(bands) {
  if (!bands.length) return null;
  const count = [0, 0, 0, 0];
  bands.forEach(b => count[b]++);
  let mode = 0, max = -1;
  for (let k = 0; k < 4; k++) if (count[k] >= max) { max = count[k]; mode = k; }
  const worst = Math.max(...bands);
  return Math.max(mode, worst - 1);
}

// run.values: { location_key: value_mm } → 그룹별 판정 + overall (0..3, 값이 없으면 null)
//   Small overlap: { lower, upper, overall }   Moderate overlap 2.0: { structure, overall }
function rateRun(run, protocol = PROTOCOL) {
  const bands = Object.fromEntries(protocol.groups.map(g => [g.key, []]));
  protocol.locations.forEach(loc => {
    const v = run.values[loc.key];
    if (Number.isFinite(v)) bands[loc.group].push(bandOf(v, loc.t));
  });
  const result = {};
  protocol.groups.forEach(g => { result[g.key] = subRating(bands[g.key]); });
  const subs = protocol.groups.map(g => result[g.key]);
  result.overall = subs.includes(null) ? null : Math.max(...subs);
  return result;
}

// ===== 3. 그래프 선택 (최대 3개) =====
// slots: 길이 CHART_MAX 배열 (runId 또는 null). 색·무늬는 slot 위치로 고정 → 다른 run을 빼도 색이 안 바뀜
const CHART_MAX = 3;

function toggleChart(slots, runId) {
  const s = slots.slice(), i = s.indexOf(runId);
  if (i >= 0) { s[i] = null; return { slots: s, ok: true }; }
  const empty = s.indexOf(null);
  if (empty < 0) return { slots, ok: false };
  s[empty] = runId;
  return { slots: s, ok: true };
}

function removeFromChart(slots, runId) {
  return slots.map(id => (id === runId ? null : id));
}
// @core-end

// ===== 4. 상태 (시험 탭마다 따로) =====
// runs: runId 순 정렬, shown: 표 ON/OFF { runId: bool }, slots: 그래프 칸 (최대 3)
const newTab = () => ({ runs: [], shown: {}, slots: Array(CHART_MAX).fill(null) });
const state = { active: PROTOCOL.id, tabs: Object.fromEntries(Object.keys(PROTOCOLS).map(id => [id, newTab()])) };
const cur = () => state.tabs[state.active];
const proto = () => PROTOCOLS[state.active];

function compareId(a, b) {
  const na = Number(a), nb = Number(b);
  return Number.isFinite(na) && Number.isFinite(nb) ? na - nb : String(a).localeCompare(String(b));
}

// 같은 run_id 가 이미 있으면 새 파일로 교체 (표·그래프 선택 상태는 유지). 교체됐으면 true
function addRun(tab, run) {
  const i = tab.runs.findIndex(r => r.runId === run.runId);
  if (i >= 0) tab.runs[i] = run;
  else {
    tab.runs.push(run);
    tab.runs.sort((a, b) => compareId(a.runId, b.runId));
    tab.shown[run.runId] = true;
  }
  return i >= 0;
}

// 새로 불러온 run은 그래프 빈 칸이 있으면 run_id 순으로 채운다
function autoFillChart(tab, newIds) {
  newIds.slice().sort(compareId).forEach(id => {
    if (tab.slots.includes(id)) return;
    const r = toggleChart(tab.slots, id);
    if (r.ok) tab.slots = r.slots;
  });
}

function setShown(tab, runId, on) {
  tab.shown[runId] = on;
  if (!on) tab.slots = removeFromChart(tab.slots, runId);
}

function removeRun(tab, runId) {
  tab.runs = tab.runs.filter(r => r.runId !== runId);
  delete tab.shown[runId];
  tab.slots = removeFromChart(tab.slots, runId);
}

// ===== 5. 데이터 로드 (Apps Script 전환 시 google.script.run 으로 교체할 자리) =====
function readFileText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}

// 드롭된 항목에서 폴더를 재귀로 펼쳐 [{ file, path }] 로 만든다
async function entriesFromDrop(dataTransfer) {
  // dataTransfer 는 이벤트가 끝나면 비워지므로 항목을 먼저 동기적으로 꺼내 둔다
  const entries = [...dataTransfer.items].map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return [...dataTransfer.files].map(f => ({ file: f, path: f.name }));
  const out = [];
  async function walk(entry, prefix) {
    if (entry.isFile) {
      const file = await new Promise((res, rej) => entry.file(res, rej));
      out.push({ file, path: prefix + file.name });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const e of batch) await walk(e, prefix + entry.name + "/");
      } while (batch.length);
    }
  }
  for (const e of entries) await walk(e, "");
  return out;
}

// CSV 마다 시험 종류를 판별해 해당 탭에 넣는다
async function loadEntries(items) {
  const byPath = new Map(items.map(it => [it.path, it.file]));
  const { targets } = pickCsvTargets([...byPath.keys()]);
  if (!targets.length) {
    notify(`불러올 CSV가 없습니다. 폴더 안에서는 ${RESULT_FILE} 만 읽습니다.`, "error");
    return;
  }
  const added = {}, replaced = {};   // { testId: [runId] }
  for (const t of targets) {
    try {
      const text = await readFileText(byPath.get(t.path));
      const testId = detectProtocol(csvLocationNames(text), state.active);
      const run = parseCsv(text, t.path, t.name, PROTOCOLS[testId]);
      const bucket = addRun(state.tabs[testId], run) ? replaced : added;
      (bucket[testId] = bucket[testId] || []).push(run.runId);
      run.warnings.forEach(w => notify(`${t.path}: ${w}`, "error"));
    } catch (e) {
      notify(e.message, "error");
    }
  }
  const ids = Object.keys(PROTOCOLS);
  ids.forEach(id => added[id] && autoFillChart(state.tabs[id], added[id]));
  const addedMsg = ids.filter(id => added[id]).map(id => `${PROTOCOLS[id].tab} ${added[id].length}개`);
  if (addedMsg.length) notify(`run 을 불러왔습니다: ${addedMsg.join(", ")}`);
  ids.filter(id => replaced[id]).forEach(id =>
    notify(`같은 run_id 를 새 파일로 교체했습니다 (${PROTOCOLS[id].tab}): run ${replaced[id].sort(compareId).join(", ")}`));
  // 지금 탭에는 들어간 게 없고 다른 탭에만 들어갔으면 그 탭으로 이동
  const touched = ids.filter(id => added[id] || replaced[id]);
  if (touched.length && !touched.includes(state.active)) state.active = touched[0];
  render();
}

// ===== 6. 렌더링 =====
const BAND_COLORS = ["#0ca30c", "#fab219", "#ec835a", "#d03b3b"];
const RATING_TEXT = ["var(--good-t)", "var(--warn-t)", "var(--warn-t)", "var(--bad-t)"];
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
const theme = () => darkQuery.matches
  ? { dark: true,  series: ["#f0efec", "#3987e5", "#e87ba4"], ink: "#f0efec" }
  : { dark: false, series: ["#2c2c2a", "#2a78d6", "#d55181"], ink: "#2c2c2a" };
const MUTED = "#898781";

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = v => (Number.isFinite(v) ? v.toFixed(1) : "–");
const ratingName = r => (r === null ? "–" : RATINGS[r]);
const ratingColor = r => (r === null ? "var(--muted)" : RATING_TEXT[r]);

// 그래프 칸별 색·무늬: 1번째 단색, 2번째 사선, 3번째 점
const slotOf = runId => cur().slots.indexOf(runId);
const colorOf = slot => theme().series[slot];

function fillFor(slot) {
  if (slot === 1) return `url(#pat-stripe-${slot})`;
  if (slot === 2) return `url(#pat-dot-${slot})`;
  return colorOf(slot);
}

function swatch(slot) {
  if (slot < 0) return `<span class="swatch none" title="그래프에 없음"></span>`;
  let bg = `background:${colorOf(slot)};`;
  if (slot === 1) bg += "background-image:repeating-linear-gradient(45deg,transparent 0 2px,rgba(255,255,255,.6) 2px 3px);";
  if (slot === 2) bg += "background-image:radial-gradient(rgba(255,255,255,.7) 1px,transparent 1.2px);background-size:4px 4px;";
  return `<span class="swatch" style="${bg}"></span>`;
}

const W = 720, H = 400, ML = 40, MR = 8, MT = 10, MB = 100;
const PW = W - ML - MR, PH = H - MT - MB;

// runs: 그래프에 그릴 run (slot 순서)
function renderChart(runs) {
  const p = proto(), locs = p.locations;
  const { dark, ink } = theme();
  const N = locs.length, CW = PW / N;
  const xc = i => ML + CW * (i + 0.5);
  const maxV = Math.max(0, ...runs.flatMap(r => Object.values(r.values)));
  const yMax = Math.max(p.yMax, Math.ceil(maxV / p.yStep) * p.yStep);
  const y = v => MT + PH - (Math.min(Math.max(v, 0), yMax) / yMax) * PH;

  const defs = [1, 2].map(s => {
    const c = colorOf(s);
    return s === 1
      ? `<pattern id="pat-stripe-1" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
           <rect width="4" height="4" fill="${c}"/><rect width="1.2" height="4" fill="#fff" fill-opacity=".55"/></pattern>`
      : `<pattern id="pat-dot-2" width="4" height="4" patternUnits="userSpaceOnUse">
           <rect width="4" height="4" fill="${c}"/><circle cx="2" cy="2" r=".9" fill="#fff" fill-opacity=".7"/></pattern>`;
  }).join("");

  // 판정구간 배경
  let bands = "";
  const idx = [...Array(N).keys()];
  for (let k = 3; k >= 0; k--) {
    const top = idx.map(i => (k < 3 ? locs[i].t[k] : yMax));
    const pts = [`${ML},${y(top[0])}`]
      .concat(idx.map(i => `${xc(i)},${y(top[i])}`))
      .concat([`${W - MR},${y(top[N - 1])}`, `${W - MR},${y(0)}`, `${ML},${y(0)}`]);
    bands += `<polygon points="${pts.join(" ")}" fill="${BAND_COLORS[k]}" fill-opacity="${dark ? 0.45 : 0.55}"/>`;
  }

  // 축
  let axes = "";
  for (let v = 0; v <= yMax; v += p.yStep) {
    axes += `<text x="${ML - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${MUTED}">${v}</text>`;
  }
  axes += `<text x="12" y="${MT + PH / 2}" font-size="12" fill="${MUTED}" text-anchor="middle"
             transform="rotate(-90 12 ${MT + PH / 2})">Measured intrusion (mm)</text>`;
  locs.forEach((loc, i) => {
    axes += `<text x="${xc(i) + 4}" y="${y(0) + 12}" font-size="11" fill="${MUTED}" text-anchor="end"
               transform="rotate(-45 ${xc(i) + 4} ${y(0) + 12})">${loc.label}</text>`;
    // 그룹 경계선 (lower / upper)
    if (i > 0 && locs[i - 1].group !== loc.group) {
      const x = ML + CW * i;
      axes += `<line x1="${x}" y1="${MT}" x2="${x}" y2="${y(0)}" stroke="${ink}" stroke-dasharray="3 3"/>`;
    }
  });

  // 막대 (다중 run = 그룹 막대, 1개 run = 막대 위 값 표시)
  let bars = "";
  const n = runs.length;
  const bw = n > 1 ? Math.min(14, (CW - 8) / n) : 20;
  locs.forEach((loc, i) => {
    runs.forEach((run, j) => {
      const v = run.values[loc.key];
      if (!Number.isFinite(v)) return;
      const x = xc(i) - (n * bw) / 2 + j * bw;
      bars += `<rect x="${x}" y="${y(v)}" width="${bw - 1}" height="${y(0) - y(v)}" fill="${fillFor(slotOf(run.runId))}" rx="1.5">
                 <title>run ${esc(run.runId)} · ${loc.name}: ${fmt(v)} mm</title></rect>`;
      if (n === 1) {
        bars += `<text x="${xc(i)}" y="${y(v) - 5}" text-anchor="middle" font-size="11" fill="${ink}">${fmt(v)}</text>`;
      }
    });
  });
  const hint = n ? "" : `<text x="${ML + PW / 2}" y="${MT + 24}" text-anchor="middle" font-size="13" fill="${ink}">
                          아래 표에서 "그래프"를 체크하면 여기에 그려집니다 (최대 ${CHART_MAX}개)</text>`;

  document.getElementById("chart").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(p.tab)} 측정 위치별 intrusion과 IIHS 판정 구간">
      <defs>${defs}</defs>${bands}${axes}${bars}${hint}
    </svg>`;
}

// runs: 그래프에 그린 run (최대 3개)
function renderCards(runs) {
  const p = proto();
  document.getElementById("cards").innerHTML = runs.map(run => {
    const r = rateRun(run, p);
    const missing = p.locations.filter(l => !Number.isFinite(run.values[l.key])).length;
    const sub = p.groups.length > 1
      ? p.groups.map(g => `${g.label} ${ratingName(r[g.key])}`).join(" · ")
      : "구조 단일 판정";
    return `<div class="card">
      <div class="k">${swatch(slotOf(run.runId))} run ${esc(run.runId)} · ${esc(run.name)}</div>
      <div class="v" style="color:${ratingColor(r.overall)}">${ratingName(r.overall)}</div>
      <div class="k">${sub}</div>
      ${missing ? `<div class="w">측정위치 ${missing}개 누락</div>` : ""}
    </div>`;
  }).join("");
}

// runs: 표 ON 인 run 전부 (개수 제한 없음)
function renderTable(runs) {
  const p = proto(), t = cur();
  const el = document.getElementById("table");
  if (!runs.length) {
    el.innerHTML = `<p class="empty" style="padding:0 12px">${t.runs.length ? "표에 켜진 run이 없습니다. 위 목록에서 켜 주세요." : "이 시험에 불러온 run이 없습니다."}</p>`;
    return;
  }
  const multi = p.groups.length > 1;
  const groupLabel = Object.fromEntries(p.groups.map(g => [g.key, g.label]));
  const cls = run => (slotOf(run.runId) >= 0 ? "charted" : "");
  const head = `<tr><th>측정위치</th>${multi ? "<th>그룹</th>" : ""}<th>기준 G / A / M</th>${runs.map(run => `
    <th class="run ${cls(run)}">
      <label><input type="checkbox" data-chart="${esc(run.runId)}" ${slotOf(run.runId) >= 0 ? "checked" : ""}>그래프</label>
      <div class="rid">${swatch(slotOf(run.runId))} run ${esc(run.runId)}</div>
      <div class="rnm">${esc(run.name)}</div>
    </th>`).join("")}</tr>`;

  const body = p.locations.map((loc, i) => {
    const prev = p.locations[i - 1];
    const cells = runs.map(run => {
      const v = run.values[loc.key];
      if (!Number.isFinite(v)) return `<td class="${cls(run)}" style="color:var(--muted)">–</td>`;
      const b = bandOf(v, loc.t);
      return `<td class="r${b}" title="${RATINGS[b]}">${fmt(v)}</td>`;
    }).join("");
    return `<tr class="${prev && prev.group !== loc.group ? "split" : ""}">
      <td>${loc.name}</td>${multi ? `<td class="grp">${groupLabel[loc.group]}</td>` : ""}<td class="th">${loc.t.join(" / ")}</td>${cells}</tr>`;
  }).join("");

  // 판정 결과 줄: 그룹이 여럿이면 그룹별 + 종합, 하나면 구조 판정 한 줄
  const ratings = runs.map(run => rateRun(run, p));
  const lines = multi
    ? p.groups.map(g => ({ key: g.key, label: `${g.label} 판정` })).concat({ key: "overall", label: "종합 판정" })
    : [{ key: "overall", label: "Structure 판정" }];
  const foot = lines.map((ln, li) => `<tr class="rating${li ? "" : " first"}"><td>${ln.label}</td>${multi ? "<td></td>" : ""}<td></td>${
    ratings.map((r, j) => `<td class="${cls(runs[j])}" style="color:${ratingColor(r[ln.key])}">${ratingName(r[ln.key])}</td>`).join("")}</tr>`).join("");

  el.innerHTML = `<table><thead>${head}</thead><tbody>${body}${foot}</tbody></table>`;
}

function renderTabs() {
  document.getElementById("tabs").innerHTML = Object.values(PROTOCOLS).map(p => `
    <button type="button" class="tab" role="tab" data-tab="${p.id}" aria-selected="${p.id === state.active}">
      ${p.tab}<span class="cnt">${state.tabs[p.id].runs.length}</span></button>`).join("");
  const p = proto();
  document.getElementById("src").textContent = `판정 기준: ${p.source} · ${p.note}`;
}

function renderRunList() {
  const t = cur();
  const shownCount = t.runs.filter(r => t.shown[r.runId]).length;
  const charted = t.slots.filter(id => id !== null).length;
  document.getElementById("toolbar").innerHTML = t.runs.length ? `
    <span>불러온 run ${t.runs.length}개 · 표 ${shownCount}개 · 그래프 ${charted}/${CHART_MAX}</span>
    <span class="sp"></span>
    <button type="button" class="btn" data-act="all-on">표 전체 켜기</button>
    <button type="button" class="btn" data-act="all-off">표 전체 끄기</button>
    <button type="button" class="btn" data-act="clear">전체 삭제</button>` : "";

  const el = document.getElementById("runs");
  if (!t.runs.length) {
    el.innerHTML = `<li class="empty" style="border:none">이 시험에 불러온 run이 없습니다. samples 폴더를 고르면 세 시험의 데모 run이 탭별로 들어갑니다.</li>`;
    return;
  }
  el.innerHTML = t.runs.map(r => `
    <li class="${t.shown[r.runId] ? "" : "off"}" title="${esc(r.fileName)}">
      <label><input type="checkbox" data-show="${esc(r.runId)}" ${t.shown[r.runId] ? "checked" : ""}>
        ${swatch(slotOf(r.runId))}<span class="nm">run ${esc(r.runId)} · ${esc(r.name)}</span></label>
      <button type="button" class="x" data-remove="${esc(r.runId)}" aria-label="run ${esc(r.runId)} 삭제">삭제</button>
    </li>`).join("");
}

function render() {
  const t = cur();
  const shown = t.runs.filter(r => t.shown[r.runId]);
  const charted = t.slots.filter(id => id !== null).map(id => t.runs.find(r => r.runId === id)).filter(Boolean);
  renderTabs();
  renderRunList();
  renderCards(charted);
  renderChart(charted);
  renderTable(shown);
}

function notify(message, kind) {
  const box = document.createElement("div");
  box.className = `toast${kind === "error" ? " error" : ""}`;
  box.textContent = message;
  document.getElementById("toasts").appendChild(box);
  setTimeout(() => box.remove(), kind === "error" ? 7000 : 4000);
}

// ===== 7. UI 초기화 =====
const folderInput = document.getElementById("folder");
const fileInput = document.getElementById("file");
document.getElementById("pickFolder").addEventListener("click", () => folderInput.click());
document.getElementById("pickFile").addEventListener("click", () => fileInput.click());
folderInput.addEventListener("change", () => {
  loadEntries([...folderInput.files].map(f => ({ file: f, path: f.webkitRelativePath || f.name })));
  folderInput.value = "";
});
fileInput.addEventListener("change", () => {
  loadEntries([...fileInput.files].map(f => ({ file: f, path: f.name })));
  fileInput.value = "";

const drop = document.getElementById("drop");
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", async e => loadEntries(await entriesFromDrop(e.dataTransfer)));
// 드롭 영역 밖에 떨어뜨려도 브라우저가 파일을 열지 않도록
["dragover", "drop"].forEach(t => window.addEventListener(t, e => e.preventDefault()));

document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest("[data-tab]");
  if (!btn || btn.dataset.tab === state.active) return;
  state.active = btn.dataset.tab;
  render();
});

document.getElementById("toolbar").addEventListener("click", e => {
  const act = e.target.dataset.act, t = cur();
  if (!act) return;
  if (act === "all-on") t.runs.forEach(r => setShown(t, r.runId, true));
  if (act === "all-off") t.runs.forEach(r => setShown(t, r.runId, false));
  if (act === "clear") {
    if (!confirm(`${proto().tab} 탭의 run ${t.runs.length}개를 모두 목록에서 뺄까요? (파일은 지워지지 않습니다)`)) return;
    t.runs.slice().forEach(r => removeRun(t, r.runId));
  }
  render();
});

const runList = document.getElementById("runs");
runList.addEventListener("change", e => {
  if (e.target.dataset.show === undefined) return;
  setShown(cur(), e.target.dataset.show, e.target.checked);
  render();
});
runList.addEventListener("click", e => {
  if (e.target.dataset.remove === undefined) return;
  removeRun(cur(), e.target.dataset.remove);
  render();
});

document.getElementById("table").addEventListener("change", e => {
  const id = e.target.dataset.chart;
  if (id === undefined) return;
  const t = cur(), r = toggleChart(t.slots, id);
  if (!r.ok) notify(`그래프는 최대 ${CHART_MAX}개까지 그릴 수 있습니다. 다른 run의 체크를 먼저 해제하세요.`, "error");
  t.slots = r.slots;
  render();
});

document.getElementById("legend").innerHTML = RATINGS.map((n, k) =>
  `<span><span class="swatch" style="background:${BAND_COLORS[k]};opacity:.55"></span>${n}</span>`).join("");

darkQuery.addEventListener("change", render);
render();
</script>
</body>
</html>
